{% extends 'base.html' %}

{% block content %}
<main class="max-w-screen-xl mx-auto px-4 py-8">
  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Create New Listing</h1>
    <p class="text-gray-600 mt-2">List your computers with us for a faster sale, and a better offer!</p>
  </div>

  <!-- Form -->
  <div class="bg-white rounded-lg shadow border border-gray-200 p-6">
    <form method="POST" enctype="multipart/form-data" class="space-y-6">
      {{ form.hidden_tag() }}

      <!-- Title -->
      <div>
        <label for="title" class="block mb-2 text-sm font-medium text-gray-900">Listing Title</label>
        <input type="text" name="title" id="title" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" placeholder="Title..." required>
        {% if form.title.errors %}
          <p class="mt-2 text-sm text-red-600">{{ form.title.errors[0] }}</p>
        {% endif %}
      </div>

      <!-- Starting Bid -->
      <div>
        <label for="starting_bid" class="block mb-2 text-sm font-medium text-gray-900">Starting Bid</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
            <span class="text-gray-500">$</span>
          </div>
          <input type="text" name="starting_bid" id="starting_bid" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 pl-8" placeholder="0.00" required>
        </div>
      </div>

      <!-- Brand and CPU Row -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="brand" class="block mb-2 text-sm font-medium text-gray-900">Brand</label>
          <select name="brand" id="brand" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5">
            <option value="Apple">Apple</option>
            <option value="Microsoft">Microsoft</option>
            <option value="Dell">Dell</option>
            <option value="HP">HP</option>
            <option value="Lenovo">Lenovo</option>
            <option value="Acer">Acer</option>
          </select>
        </div>
        <div>
          <label for="cpu" class="block mb-2 text-sm font-medium text-gray-900">CPU</label>
          <select name="cpu" id="cpu" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5">
            <option value="i3">i3</option>
            <option value="i5">i5</option>
            <option value="i7">i7</option>
            <option value="Ryzen 3">Ryzen 3</option>
            <option value="Ryzen 5">Ryzen 5</option>
            <option value="Ryzen 7">Ryzen 7</option>
          </select>
        </div>
      </div>

      <!-- RAM and Storage Row -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="ram" class="block mb-2 text-sm font-medium text-gray-900">RAM</label>
          <select name="ram" id="ram" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5">
            <option value="4GB">4GB</option>
            <option value="8GB">8GB</option>
            <option value="16GB">16GB</option>
            <option value="32GB">32GB</option>
          </select>
        </div>
        <div>
          <label for="storage" class="block mb-2 text-sm font-medium text-gray-900">Storage</label>
          <select name="storage" id="storage" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5">
            <option value="64GB">64GB</option>
            <option value="128GB">128GB</option>
            <option value="256GB">256GB</option>
            <option value="512GB">512GB</option>
            <option value="1TB">1TB</option>
          </select>
        </div>
      </div>

      <!-- Condition and End Date Row -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="condition" class="block mb-2 text-sm font-medium text-gray-900">Condition</label>
          <select name="condition" id="condition" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5">
            <option value="Excellent">Excellent</option>
            <option value="Good">Good</option>
            <option value="Minor defects">Minor defects</option>
            <option value="Used">Used</option>
            <option value="New">New</option>
          </select>
        </div>
        <div>
          <label for="end_date" class="block mb-2 text-sm font-medium text-gray-900">End Date</label>
          <input type="date" name="end_date" id="end_date" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" required>
        </div>
      </div>

      <!-- Image -->
      <div>
        <label for="image_url" class="block mb-2 text-sm font-medium text-gray-900">Image</label>
        <div class="flex items-center justify-center w-full">
          <label for="image_url" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100" id="drop-zone">
            <div class="flex flex-col items-center justify-center pt-5 pb-6" id="upload-prompt">
              <svg class="w-8 h-8 mb-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
              <p class="text-sm text-gray-500">Click to upload image</p>
            </div>
            <div id="file-info" class="hidden flex flex-col items-center justify-center">
              <svg class="w-8 h-8 mb-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              <p class="text-sm text-green-600 font-medium" id="file-name"></p>
            </div>
            <input id="image_url" name="image_url" type="file" class="hidden" accept=".png,.jpg,.jpeg">
          </label>
        </div>
        <script>
          document.getElementById('image_url').addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name;
            if (fileName) {
              document.getElementById('upload-prompt').classList.add('hidden');
              document.getElementById('file-info').classList.remove('hidden');
              document.getElementById('file-name').textContent = fileName;
            }
          });
        </script>
        <p class="mt-1 text-sm text-gray-500">PNG, JPG or JPEG</p>
      </div>

      <!-- Description -->
      <div>
        <label for="description" class="block mb-2 text-sm font-medium text-gray-900">Description</label>
        <textarea name="description" id="description" rows="4" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" placeholder="Description of listing..." required></textarea>
      </div>

      <!-- Submit -->
      <button type="submit" class="text-white bg-primary hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
        Post Listing
      </button>
    </form>
  </div>

  <script>
    // Set default end date to 1 month from now
    const endDateInput = document.getElementById('end_date');
    const oneMonthFromNow = new Date();
    oneMonthFromNow.setMonth(oneMonthFromNow.getMonth() + 1);
    endDateInput.value = oneMonthFromNow.toISOString().split('T')[0];
  </script>
</main>
{% endblock %}
