{% extends 'base.html' %}

{% block content %}
<div class="min-h-[calc(100vh-200px)] flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-lg shadow p-8">
      <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">{{ heading }}</h2>

      <form method="POST" class="space-y-6">
        {{ form.hidden_tag() }}
        
        <div>
          <label for="user_name" class="block mb-2 text-sm font-medium text-gray-900">Username</label>
          <input type="text" name="user_name" id="user_name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" required>
        </div>

        <div>
          <label for="password" class="block mb-2 text-sm font-medium text-gray-900">Password</label>
          <input type="password" name="password" id="password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" required>
        </div>

        <button type="submit" class="w-full text-white bg-primary hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
          {{ heading }}
        </button>
      </form>

      {% if heading|lower == 'login' %}
      <p class="mt-4 text-sm text-center text-gray-500">
        New user? <a href="{{ url_for('authentication.register') }}" class="text-primary hover:underline">Click here to register</a>
      </p>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
